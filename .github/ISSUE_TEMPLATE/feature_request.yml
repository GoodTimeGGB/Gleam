name: Feature request
description: Propose a new capability or improvement
title: "[feat]: "
labels: ["type/feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Large features should be discussed before a large PR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - Low — nice to have
        - Medium — would use regularly
        - High — blocking my workflow
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues / discussions for a similar request.
          required: true
