name: Pull request labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-paths:
    name: Label by path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  label-size:
    name: Label by size
    runs-on: ubuntu-latest
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: size/XS
          xs_max_size: 50
          s_label: size/S
          s_max_size: 150
          m_label: size/M
          m_max_size: 400
          l_label: size/L
          l_max_size: 800
          xl_label: size/XL
          fail_if_xl: false
          message_if_xl: >
            This PR is larger than usual. Consider splitting it if practical.
