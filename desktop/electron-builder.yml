# Phase 0 spike: minimal config. Only the Linux unpacked target ("dir") has been built and checked.
# Signing, notarization, installers (dmg) and fuses are Phase 1+.
appId: ai.gleam.desktop
productName: Gleam
publish:
  provider: github
  owner: gleam-ai
  repo: Gleam
directories:
  output: dist
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
asar: true
# The Go sidecar is built per platform by scripts/build-sidecar.mjs into .sidecar/<platform>-<arch>/
# and shipped outside the asar so it can be executed directly.
extraResources:
  - from: .sidecar/${platform}-${arch}/
    to: bin/
    filter:
      - "**/*"
  # 应用图标：窗口/任务栏运行时读它（主进程 window.ts 从 resources/icon.png 取）。
  # 下面各平台的 icon 是另一回事——那个是打进可执行文件、给文件管理器和安装包看的。
  - from: ../assets/icons/gleam-512.png
    to: icon.png
linux:
  target:
    - dir
  category: Development
  icon: ../assets/icons/gleam-512.png
win:
  target:
    - nsis
  icon: ../assets/gleam.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Gleam-Setup-${version}.${ext}
mac:
  target:
    - dir
  icon: ../assets/gleam.icns
